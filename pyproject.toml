[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "netark-mcp"
version = "3.2.0"
description = "NetArk (N.E.T.A.R.K.) — Zero-Dependency Deterministic AI Coding Harness & Portable Markdown Governance MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "joinblue", email = "joinblue42@gmail.com" }
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-coding",
  "guardrails",
  "ast",
  "claude-code",
  "antigravity"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/joinblue/NetArk"
Repository = "https://github.com/joinblue/NetArk"
Documentation = "https://github.com/joinblue/NetArk/tree/main/docs"
Issues = "https://github.com/joinblue/NetArk/issues"

[project.scripts]
netark-mcp = "netark_mcp.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/netark_mcp"]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/artifact_header.schema.json" = "netark_mcp/_core/schemas/artifact_header.schema.json"
"schemas/context_node.schema.json" = "netark_mcp/_core/schemas/context_node.schema.json"
"schemas/code_hygiene_ast.py" = "netark_mcp/_core/schemas/code_hygiene_ast.py"
"schemas/codebook_compiler.py" = "netark_mcp/_core/schemas/codebook_compiler.py"
"schemas/doc_initializer.py" = "netark_mcp/_core/schemas/doc_initializer.py"
"schemas/hook_lifecycle.py" = "netark_mcp/_core/schemas/hook_lifecycle.py"
"schemas/mcp_tools_core.py" = "netark_mcp/_core/schemas/mcp_tools_core.py"
"schemas/netark_guard_core.py" = "netark_mcp/_core/schemas/netark_guard_core.py"
"schemas/ribc_gate.py" = "netark_mcp/_core/schemas/ribc_gate.py"
"schemas/schema_validator.py" = "netark_mcp/_core/schemas/schema_validator.py"
"schemas/topology_graph.py" = "netark_mcp/_core/schemas/topology_graph.py"
"schemas/workspace_placement_guard.py" = "netark_mcp/_core/schemas/workspace_placement_guard.py"
"scripts/auto_update_map.py" = "netark_mcp/_core/scripts/auto_update_map.py"
"scripts/netark_guard_daemon.py" = "netark_mcp/_core/scripts/netark_guard_daemon.py"
"scripts/netark_init.py" = "netark_mcp/_core/scripts/netark_init.py"
"scripts/sync_doc_metadata.py" = "netark_mcp/_core/scripts/sync_doc_metadata.py"
"scripts/netark_mcp_server.py" = "netark_mcp/_core/scripts/netark_mcp_server.py"
"templates" = "netark_mcp/_core/templates"
"memory/index/TAXONOMY.json" = "netark_mcp/_core/memory/index/TAXONOMY.json"

[tool.hatch.build.targets.sdist]
include = [
  "src/netark_mcp/**",
  "schemas/**",
  "scripts/auto_update_map.py",
  "scripts/netark_guard_daemon.py",
  "scripts/netark_init.py",
  "scripts/sync_doc_metadata.py",
  "scripts/netark_mcp_server.py",
  "templates/**",
  "memory/index/TAXONOMY.json",
  "docs/**",
  "LICENSE",
  "README.md",
  "README.zh-TW.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "pyproject.toml",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]
