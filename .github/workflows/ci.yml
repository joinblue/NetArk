name: NetArk Cross-Platform CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-blackbox-matrix:
    name: "Package, MCP & Hook Matrix (${{ matrix.os }} / py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build --wheel --sdist

      - name: Install isolated CLI via uv tool install and run black-box E2E checks
        shell: python
        run: |
          import glob, json, os, shutil, socket, subprocess, sys, tempfile, time, urllib.request
          from pathlib import Path

          wheels = sorted(glob.glob("dist/*.whl"))
          assert len(wheels) == 1, f"Expected 1 wheel, found {wheels}"
          subprocess.check_call(["uv", "tool", "install", "--force", wheels[0]])

          bin_dir = subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip()
          cli = shutil.which("netark-mcp", path=bin_dir) or shutil.which("netark-mcp")
          assert cli, f"netark-mcp executable not found in {bin_dir} or PATH"

          with tempfile.TemporaryDirectory() as tmp:
              tmp_root = Path(tmp)
              for idx, target in enumerate(("memory", "claude", "agy", "pi")):
                  ws = tmp_root / f"ws_{idx}_{target}"
                  ws.mkdir()
                  res = subprocess.run([cli, "init", "--target", target, "--lang", "en", "--cwd", str(ws)], text=True, encoding="utf-8", capture_output=True, check=True)
                  data = json.loads(res.stdout)
                  assert data["status"] == "ok", data
                  assert list(ws.rglob("*.py")) == [], f"Unexpected .py files in {target} workspace!"

              ws_mem = tmp_root / "ws_0_memory"
              assert (ws_mem / ".mcp.json").is_file()
              assert (tmp_root / "ws_1_claude" / ".claude" / "settings.json").is_file()
              assert (tmp_root / "ws_2_agy" / ".agents" / "hooks.json").is_file()
              assert (tmp_root / "ws_3_pi" / ".pi" / "mcp.json").is_file() and (tmp_root / "ws_3_pi" / ".pi" / "extensions" / "netark-guard.ts").is_file()

              # Verify MCP stdio server (initialize, ping, tools/list, tools/call)
              fake_secret = "sk-proj-" + "1234567890abcdefghijklmnop"
              rpc_reqs = [
                  {"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2024-11-05", "capabilities": {}, "clientInfo": {"name": "ci", "version": "1.0"}}},
                  {"jsonrpc": "2.0", "method": "notifications/initialized"},
                  {"jsonrpc": "2.0", "id": 2, "method": "ping"},
                  {"jsonrpc": "2.0", "id": 3, "method": "tools/list"},
                  {"jsonrpc": "2.0", "id": 4, "method": "tools/call", "params": {"name": "netark_query", "arguments": {"query": "000"}}},
                  {"jsonrpc": "2.0", "id": 5, "method": "tools/call", "params": {"name": "netark_record", "arguments": {"intent": "note", "title": "CI Note", "body": "- [FACT] Verified in CI.", "mode": "preflight"}}},
                  {"jsonrpc": "2.0", "id": 6, "method": "tools/call", "params": {"name": "netark_record", "arguments": {"intent": "note", "title": "CI Note", "body": "- [FACT] Verified in CI.", "mode": "write"}}},
                  {"jsonrpc": "2.0", "id": 7, "method": "tools/call", "params": {"name": "netark_guard", "arguments": {"action": "oracle"}}},
                  {"jsonrpc": "2.0", "id": 8, "method": "tools/call", "params": {"name": "netark_guard", "arguments": {"action": "setup"}}},
              ]
              rpc_in = "\n".join(json.dumps(r) for r in rpc_reqs) + "\n"
              srv = subprocess.run([cli, "serve", "--cwd", str(ws_mem)], input=rpc_in, text=True, encoding="utf-8", capture_output=True, check=True)
              resps = {r["id"]: r["result"] for r in (json.loads(ln) for ln in srv.stdout.splitlines() if ln.strip()) if "id" in r}
              assert "instructions" in resps[1] and resps[1]["serverInfo"]["name"] == "netark-mcp"
              tools = resps[3]["tools"]
              assert {t["name"] for t in tools} == {"netark_query", "netark_record", "netark_guard"}
              schema_chars = len(json.dumps(tools, separators=(",", ":")))
              assert schema_chars <= 1280 and (schema_chars // 4) <= 320, f"Tool schema unexpectedly large: {schema_chars} chars"
              assert json.loads(resps[6]["content"][0]["text"])["ok"] is True
              assert json.loads(resps[7]["content"][0]["text"])["ok"] is True
              assert "Hook CLI Contract" in json.loads(resps[8]["content"][0]["text"])["contract"]

              # Verify PreToolUse deterministic hooks across dialects
              env_payload = json.dumps({"tool_name": "read_file", "tool_input": {"path": ".env"}})
              for dialect, expect_rc in (("agy", 0), ("claude", 2), ("pi", 2)):
                  hk = subprocess.run([cli, "hook", "--hook-mode", dialect, "--cwd", str(ws_mem)], input=env_payload, text=True, encoding="utf-8", capture_output=True)
                  assert hk.returncode == expect_rc, f"{dialect} rc={hk.returncode}: {hk.stdout} {hk.stderr}"
                  combined = hk.stdout + hk.stderr
                  assert "SEC-CRED" in combined and "[RuleDoc]" in combined

              sec_payload = json.dumps({"tool_name": "write_file", "tool_input": {"path": "src/app.py", "content": f'KEY = "{fake_secret}"\ntry:\n    pass\nexcept:\n    pass\n'}})
              hk2 = subprocess.run([cli, "hook", "--hook-mode", "claude", "--cwd", str(ws_mem)], input=sec_payload, text=True, encoding="utf-8", capture_output=True)
              assert hk2.returncode == 2 and "SEC-PREWRITE-SECRET" in (hk2.stdout + hk2.stderr)

              # Verify netark-mcp dashboard single-project read-only server (zero-.py workspace)
              with socket.socket() as sock:
                  sock.bind(("127.0.0.1", 0))
                  dash_port = sock.getsockname()[1]
              dash_proc = subprocess.Popen(
                  [cli, "dashboard", "--cwd", str(ws_mem), "--host", "127.0.0.1", "--port", str(dash_port)],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True,
              )
              try:
                  base_url = f"http://127.0.0.1:{dash_port}"
                  proj_data = None
                  for _ in range(50):
                      try:
                          with urllib.request.urlopen(f"{base_url}/api/projects", timeout=1.0) as resp:
                              if resp.status == 200:
                                  proj_data = json.loads(resp.read().decode("utf-8"))
                                  break
                      except Exception:
                          time.sleep(0.2)
                  assert proj_data and any(p["id"] == ws_mem.name for p in proj_data.get("projects", [])), proj_data
                  with urllib.request.urlopen(f"{base_url}/", timeout=2.0) as html_resp:
                      html_text = html_resp.read().decode("utf-8")
                      assert html_resp.status == 200 and "NetArk" in html_text and "paneToggleBar" in html_text
                  req = urllib.request.Request(f"{base_url}/api/project/{ws_mem.name}/rescan", method="POST", data=b"")
                  with urllib.request.urlopen(req, timeout=5.0) as rescan_resp:
                      rescan_data = json.loads(rescan_resp.read().decode("utf-8"))
                      assert rescan_resp.status == 200 and len(rescan_data.get("nodes", [])) >= 5
              finally:
                  dash_proc.terminate()
                  try:
                      dash_proc.wait(timeout=5)
                  except Exception:
                      dash_proc.kill()

          print("All cross-platform CLI, MCP stdio, dashboard, and PreToolUse hook checks passed.")

  deterministic-core-selftest:
    name: "Core Guard Self-Tests & Documentation Integrity"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Run core stdlib self-tests
        run: |
          uv run --no-project python schemas/netark_guard_core.py --self-test
          uv run --no-project python scripts/netark_guard_daemon.py --self-test
          uv run --no-project python scripts/netark_init.py --self-test

      - name: Validate visual README assets exist and are non-empty
        shell: python
        run: |
          from pathlib import Path
          expected = (
              "docs/assets/hero-architecture.png",
              "docs/assets/demo-prewrite-guard.png",
              "docs/assets/demo-prewrite-guard.gif",
              "docs/assets/demo-token-compression.png",
              "docs/assets/demo-dashboard-preview.png",
              "scripts/render_assets/demo-prewrite-guard.tape",
              "scripts/render_assets/render_assets.py",
          )
          for rel in expected:
              p = Path(rel)
              assert p.is_file() and p.stat().st_size > 100, f"Missing or empty asset: {rel}"
          print("Validated README visual assets and renderer scripts.")
