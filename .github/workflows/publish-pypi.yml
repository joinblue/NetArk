name: Publish NetArk MCP to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build wheel and sdist"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify release version & tag parity
        shell: python
        env:
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          import os, re
          from pathlib import Path
          pyproj_ver = re.search(r'(?m)^version\s*=\s*"([^"]+)"', Path("pyproject.toml").read_text(encoding="utf-8")).group(1)
          init_ver = re.search(r'(?m)^__version__\s*=\s*"([^"]+)"', Path("src/netark_mcp/__init__.py").read_text(encoding="utf-8")).group(1)
          srv_ver = re.search(r'(?m)^NETARK_VERSION\s*=\s*"([^"]+)"', Path("scripts/netark_mcp_server.py").read_text(encoding="utf-8")).group(1)
          assert pyproj_ver == init_ver == srv_ver, f"Version drift: pyproject={pyproj_ver}, __init__={init_ver}, server={srv_ver}"
          assert Path("docs/HOOK_CONTRACT.md").read_text(encoding="utf-8") == Path("templates/mcp/HOOK_CONTRACT.md").read_text(encoding="utf-8"), "HOOK_CONTRACT.md drift!"
          if os.environ.get("GITHUB_REF", "").startswith("refs/tags/v"):
              tag = os.environ.get("GITHUB_REF_NAME", "")
              assert tag == f"v{pyproj_ver}", f"Tag {tag} does not match pyproject.toml version v{pyproj_ver}"
          print(f"Verified version parity: v{pyproj_ver}")

      - name: Build distributions
        run: uv build --wheel --sdist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-pypi:
    name: "Publish to PyPI via OIDC Trusted Publishing"
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/netark-mcp
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          skip-existing: true

  github-release:
    name: "Attach distributions to GitHub Release"
    needs:
      - build
      - publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release with wheel & sdist attachments
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
